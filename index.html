<!DOCTYPE html>
<html lang="zh-CN">
<head>

<body>

<header class="header">

    <a href="index.html" class="header-logo"><span class="icon">🥢</span><span data-i18n="ft_brand">乡村味道</span></a>
    <nav class="header-nav">
      <a href="index.html" class="active" data-i18n="nav_home">首页</a>
      <a href="#hot" data-i18n="nav_hot">热门菜谱</a>
      <a href="#all" data-i18n="nav_all">全部菜谱</a>
    </nav>
    <div class="header-right"></div>
  </div>
</header>

<div class="hero-wrap">
  <section class="hero">
    <div class="hero-slide active">
      <div class="hero-slide-bg" style="background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)"></div>
      <div class="hero-slide-overlay"></div>
      <div class="hero-content">
        <span class="hero-tag" data-i18n="hero_tag">精选</span>
        <div class="hero-title" data-i18n="hero_title">中国乡村味道</div>
        <div class="hero-desc" data-i18n="hero_desc">探索各地农村家常菜、冷门硬菜<br>找回记忆中的乡土味道</div>
        <a href="#hot" class="hero-btn" data-i18n="hero_btn">立即查看</a>
      </div>
    </div>
    <div class="hero-slide">
      <div class="hero-slide-bg" style="background:linear-gradient(135deg,#2c3e50,#e74c3c)"></div>
      <div class="hero-slide-overlay"></div>
      <div class="hero-content">
        <span class="hero-tag">东北</span>
        <div class="hero-title">东北硬菜集锦</div>
        <div class="hero-desc">锅包肉、酸菜炖排骨、杀猪菜<br>豪爽东北味，大口吃肉</div>
        <a href="#hot" class="hero-btn" data-i18n="hero_btn">立即查看</a>
      </div>
    </div>
    <div class="hero-slide">
      <div class="hero-slide-bg" style="background:linear-gradient(135deg,#c0392b,#e74c3c)"></div>
      <div class="hero-slide-overlay"></div>
      <div class="hero-content">
        <span class="hero-tag">川湘</span>
        <div class="hero-title">川湘辣味江湖</div>
        <div class="hero-desc">回锅肉、剁椒鱼头、农家小炒肉<br>无辣不欢的味蕾盛宴</div>
        <a href="#hot" class="hero-btn" data-i18n="hero_btn">立即查看</a>
      </div>
    </div>
    <div class="hero-slide">
      <div class="hero-slide-bg" style="background:linear-gradient(135deg,#27ae60,#2ecc71)"></div>
      <div class="hero-slide-overlay"></div>
      <div class="hero-content">
        <span class="hero-tag">云南</span>
        <div class="hero-title">云南山野秘味</div>
        <div class="hero-desc">汽锅鸡、酸木瓜煮鱼、过桥米线<br>原汁原味的自然馈赠</div>
        <a href="#hot" class="hero-btn" data-i18n="hero_btn">立即查看</a>
      </div>
    </div>
    <div class="hero-dots">
      <span class="hero-dot active" data-i="0"></span>
      <span class="hero-dot" data-i="1"></span>
      <span class="hero-dot" data-i="2"></span>
      <span class="hero-dot" data-i="3"></span>
    </div>

<div class="w sec" id="hot">
  <div class="sec-hd">
    <div class="sec-title" data-i18n="sec_hot">热门菜谱</div>
